<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>孙筱 · 作品集</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --accent: #1c1c1e;
    --line: #e6e6e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 16px 22px;
    background: rgba(247,247,245,0.86);
    backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; line-height: 1.25; }
  .brand b { font-size: 17px; letter-spacing: 0.5px; }
  .brand span { font-size: 12px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .dl {
    appearance: none; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
    padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; white-space: nowrap;
    transition: transform .12s ease, opacity .12s ease;
  }
  .dl:hover { opacity: .88; transform: translateY(-1px); }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 18px 60px; }
  ul.gallery { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  ul.gallery li {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,0.05);
  }
  ul.gallery img { display: block; width: 100%; height: auto; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 26px 18px 40px; }
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .brand b { font-size: 15px; }
    .dl { padding: 8px 13px; font-size: 12px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <b>孙筱 · 作品集</b>
      <span>Portfolio — 2026</span>
    </div>
    <a class="dl" href="https://github.com/741277667/portfolio/releases/download/v1.0/portfolio.pdf" target="_blank" rel="noopener">下载原版 PDF</a>
  </header>
  <main>
